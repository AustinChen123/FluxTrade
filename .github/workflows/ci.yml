name: CI

on:
  push:
    branches: [ "main", "develop", "refactor/**", "test/**", "fix/**", "feat/**", "cleanup/**" ]
  pull_request:
    branches: [ "main", "develop", "refactor/**" ]

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test secret scan range resolver
        run: bash .github/scripts/test-secret-scan-range.sh

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}/gitleaks" \
            gitleaks

      - name: Scan committed changes for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scan_range=$(bash .github/scripts/resolve-secret-scan-range.sh \
            "${EVENT_NAME}" "${EVENT_CREATED}" "${EVENT_REF}" "${BASE_SHA}" "${HEAD_SHA}" refs/remotes/origin/develop)
          "${RUNNER_TEMP}/gitleaks/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="--diff-merges=first-parent ${scan_range}" \
            --redact \
            --verbose

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: ./rust-data-service
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-data-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-data-service/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests (pure Rust, no PyO3 extension)
        run: cargo test --no-default-features

      - name: Run Redis watchdog isolation smoke
        env:
          B3_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test --no-default-features
          watchdog::tests::test_timeout_locks_only_test_environment
          -- --ignored --exact

      - name: Run Redis publisher liveness isolation smoke
        env:
          DATA_PUBLISHER_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test --no-default-features
          publisher::tests::publisher_liveness_renews_recovers_fails_at_threshold_and_expires
          -- --ignored --exact

      # TODO: Add Rust coverage with cargo-llvm-cov
      # Steps needed:
      #   1. Install cargo-llvm-cov: cargo install cargo-llvm-cov
      #   2. Run: cargo llvm-cov --no-default-features --codecov --output-path codecov.json
      #   3. Upload artifact or send to Codecov

  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-strategy
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (for fluxtrade_core.so)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-data-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-data-service/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build and install fluxtrade_core.so
        working-directory: ./rust-data-service
        run: |
          cargo build --lib --release
          cp target/release/libfluxtrade_core.so ../python-strategy/src/fluxtrade_core.so

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run invariant tests
        run: uv run pytest tests/test_invariant_*.py -v

      - name: Run unit tests with coverage
        run: uv run pytest -m "not integration" --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=77

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: python-strategy/coverage.xml
          retention-days: 30

      - name: Generate coverage badge JSON
        if: always()
        working-directory: ./python-strategy
        run: |
          # Extract coverage percentage from the XML report
          if [ -f coverage.xml ]; then
            COV_PCT=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate']) * 100
          print(f'{rate:.1f}')
          ")
            echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV_PCT}%\",\"color\":\"brightgreen\"}" > coverage-badge.json
            echo "Coverage: ${COV_PCT}%"
          else
            echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"unknown\",\"color\":\"red\"}" > coverage-badge.json
          fi

      - name: Upload coverage badge data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: python-strategy/coverage-badge.json
          retention-days: 30
        # To display a dynamic coverage badge in README, you can:
        # 1. Publish coverage-badge.json to GitHub Pages or a gist
        # 2. Use shields.io endpoint badge: ![Coverage](https://img.shields.io/endpoint?url=<URL_TO_JSON>)
        # Or integrate with Codecov/Coveralls for automatic badge generation.

  integration-check:
    name: Integration Tests (Rust + Python)
    runs-on: ubuntu-latest
    needs: [rust-check, python-check]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-data-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-data-service/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust library
        working-directory: ./rust-data-service
        run: RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup" cargo build --lib --release
        if: runner.os == 'macOS'

      - name: Build Rust library (Linux)
        working-directory: ./rust-data-service
        run: cargo build --lib --release
        if: runner.os == 'Linux'

      - name: Copy .so to Python
        run: |
          if [ -f rust-data-service/target/release/libfluxtrade_core.dylib ]; then
            cp rust-data-service/target/release/libfluxtrade_core.dylib python-strategy/src/fluxtrade_core.so
          elif [ -f rust-data-service/target/release/libfluxtrade_core.so ]; then
            cp rust-data-service/target/release/libfluxtrade_core.so python-strategy/src/fluxtrade_core.so
          else
            echo "::error::Rust library not found, cannot run integration tests"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        working-directory: ./python-strategy
        run: uv python install

      - name: Run integration tests
        working-directory: ./python-strategy
        run: uv run pytest -m "integration or rust" -v

  refactor-gate:
    name: Refactor Gate
    if: always()
    needs: [integration-check, python-check, rust-check, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate workflow and required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          ruby <<'RUBY'
          require "digest"
          require "json"
          require "yaml"

          workflow_path = ".github/workflows/ci.yml"
          manifest_path = ".github/refactor-required-jobs.json"

          fail_closed = lambda do |code, detail, next_action|
            warn "component=refactor-gate task=validate operation=aggregate stage=failed canonical_error=#{code} detail=#{detail} disposition=FAIL_CLOSED next_action=#{next_action}"
            exit 1
          end

          begin
            manifest = JSON.parse(File.read(manifest_path))
            workflow_bytes = File.binread(workflow_path)
            workflow = YAML.safe_load(workflow_bytes, aliases: false)
          rescue JSON::ParserError, Psych::Exception, Errno::ENOENT => error
            fail_closed.call("MALFORMED_CONFIGURATION", error.class.name, "repair_workflow_or_manifest")
          end

          expected_keys = %w[aggregate_job_id excluded_job_ids job_graph_digest required_job_ids schema workflow_path workflow_sha256]
          unless manifest.is_a?(Hash) && manifest.keys.sort == expected_keys &&
                 manifest["schema"] == "fluxtrade_refactor_expected_jobs_v1" &&
                 manifest["workflow_path"] == workflow_path &&
                 manifest["aggregate_job_id"] == "refactor-gate" &&
                 manifest["excluded_job_ids"] == []
            fail_closed.call("MANIFEST_SCHEMA_MISMATCH", "manifest_contract", "repair_manifest")
          end

          workflow_sha = Digest::SHA256.hexdigest(workflow_bytes)
          unless workflow_sha == manifest["workflow_sha256"]
            fail_closed.call("WORKFLOW_DIGEST_MISMATCH", "workflow_sha256=#{workflow_sha}", "update_workflow_and_manifest_atomically")
          end

          jobs = workflow.is_a?(Hash) ? workflow["jobs"] : nil
          unless jobs.is_a?(Hash) && jobs.keys.all? { |id| id.is_a?(String) }
            fail_closed.call("JOB_GRAPH_MISMATCH", "invalid_jobs", "reconcile_manifest_and_workflow")
          end

          graph = jobs.keys.sort.to_h do |id|
            job = jobs[id]
            unless job.is_a?(Hash)
              fail_closed.call("JOB_GRAPH_MISMATCH", "invalid_job=#{id}", "reconcile_manifest_and_workflow")
            end
            raw_needs = job.fetch("needs", [])
            needs = raw_needs.is_a?(String) ? [raw_needs] : raw_needs
            unless needs.is_a?(Array) && needs.all? { |need| need.is_a?(String) } && needs.uniq.length == needs.length
              fail_closed.call("JOB_GRAPH_MISMATCH", "invalid_needs=#{id}", "reconcile_manifest_and_workflow")
            end
            [id, needs.sort]
          end
          graph_sha = Digest::SHA256.hexdigest(JSON.generate(graph))
          unless graph_sha == manifest["job_graph_digest"]
            fail_closed.call("JOB_GRAPH_MISMATCH", "job_graph_digest=#{graph_sha}", "reconcile_manifest_and_workflow")
          end

          aggregate = manifest["aggregate_job_id"]
          required = manifest["required_job_ids"]
          non_aggregate = jobs.keys.reject { |id| id == aggregate }.sort
          unless required.is_a?(Array) && required == required.sort && required.uniq == required && required == non_aggregate
            fail_closed.call("JOB_GRAPH_MISMATCH", "required_job_ids", "reconcile_manifest_and_workflow")
          end
          unless graph[aggregate] == required
            fail_closed.call("JOB_GRAPH_MISMATCH", "aggregate_needs", "reconcile_manifest_and_workflow")
          end

          begin
            runtime_needs = JSON.parse(ENV.fetch("NEEDS_JSON"))
          rescue KeyError, JSON::ParserError => error
            fail_closed.call("MALFORMED_RUNTIME_NEEDS", error.class.name, "rerun_required_jobs")
          end
          unless runtime_needs.is_a?(Hash) && runtime_needs.keys.sort == required
            fail_closed.call("REQUIRED_JOB_MISSING", "runtime_job_set", "rerun_required_jobs")
          end
          required.each do |id|
            entry = runtime_needs[id]
            unless entry.is_a?(Hash) && entry["result"].is_a?(String)
              fail_closed.call("MALFORMED_RUNTIME_NEEDS", "job_id=#{id}", "rerun_required_jobs")
            end
            unless entry["result"] == "success"
              fail_closed.call("REQUIRED_JOB_NOT_SUCCESS", "job_id=#{id} result=#{entry["result"]}", "inspect_named_job")
            end
          end

          puts "component=refactor-gate task=validate operation=aggregate stage=complete disposition=PASS workflow_sha256=#{workflow_sha} job_graph_digest=#{graph_sha}"
          RUBY
