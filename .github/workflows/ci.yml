name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "true"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test secret scan range resolver
        run: bash .github/scripts/test-secret-scan-range.sh

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}/gitleaks" \
            gitleaks

      - name: Scan committed changes for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scan_range=$(bash .github/scripts/resolve-secret-scan-range.sh \
            "${EVENT_NAME}" "${EVENT_CREATED}" "${EVENT_REF}" "${BASE_SHA}" "${HEAD_SHA}" refs/remotes/origin/develop)
          "${RUNNER_TEMP}/gitleaks/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="--diff-merges=first-parent ${scan_range}" \
            --redact \
            --verbose

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: ./rust-data-service
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-data-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-data-service/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests (pure Rust, no PyO3 extension)
        run: cargo test --no-default-features

      - name: Run Redis watchdog isolation smoke
        env:
          B3_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test --no-default-features
          watchdog::tests::test_timeout_locks_only_test_environment
          -- --ignored --exact

      - name: Run Redis publisher liveness isolation smoke
        env:
          DATA_PUBLISHER_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test --no-default-features
          publisher::tests::publisher_liveness_renews_recovers_fails_at_threshold_and_expires
          -- --ignored --exact

      # TODO: Add Rust coverage with cargo-llvm-cov
      # Steps needed:
      #   1. Install cargo-llvm-cov: cargo install cargo-llvm-cov
      #   2. Run: cargo llvm-cov --no-default-features --codecov --output-path codecov.json
      #   3. Upload artifact or send to Codecov

  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./python-strategy
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (for fluxtrade_core.so)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-data-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-data-service/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Select PyO3 interpreter
        run: echo "PYO3_PYTHON=$(uv run --no-sync python -c 'import os,sys; print(os.path.abspath(sys.executable))')" >> "$GITHUB_ENV"

      - name: Build and install fluxtrade_core.so
        working-directory: ./rust-data-service
        run: |
          test -x "$PYO3_PYTHON"
          cargo build --lib --release
          cp target/release/libfluxtrade_core.so ../python-strategy/src/fluxtrade_core.so

      - name: Verify native module ABI
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -c 'import sys, fluxtrade_core; print(sys.version); print(fluxtrade_core.__file__)'

      - name: Verify profile assembly and cleanup cross-language contract
        shell: bash
        run: |
          set -euo pipefail
          profile_python="$(uv run python -c 'import os,sys; print(os.path.abspath(sys.executable))')"
          profile_python_lib="$(uv run python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          [[ -n "$profile_python" && "$profile_python" = /* && -x "$profile_python" ]]
          [[ -n "$profile_python_lib" && "$profile_python_lib" = /* && -d "$profile_python_lib" ]]
          export FLUXTRADE_PROFILE_PYTHON="$profile_python"
          export LD_LIBRARY_PATH="$profile_python_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          uv run --no-sync cargo test --manifest-path ../rust-data-service/Cargo.toml --no-default-features --test volume_profile_assemble_cli actual_executable_replays_source_pair_with_canonical_lf -- --exact

      - name: Verify profile composite native wheel contract
        shell: bash
        run: |
          set -euo pipefail
          profile_python="$(uv run --offline --no-sync python -c 'import os,sys; print(os.path.abspath(sys.executable))')"
          [[ -n "$profile_python" && "$profile_python" = /* && -x "$profile_python" ]]
          dir="$(mktemp -d "$RUNNER_TEMP/profile-composite.XXXXXX")"
          uv run --offline --no-sync maturin build --manifest-path ../rust-data-service/Cargo.toml --interpreter "$profile_python" --no-default-features --features extension-module --locked --target-dir "$dir/target" --out "$dir/wheels"
          shopt -s nullglob
          wheels=("$dir/wheels/"*.whl)
          [[ ${#wheels[@]} -eq 1 ]]
          uv run --offline --no-sync python scripts/verify_profile_composite_native.py "${wheels[0]}"

      - name: Check tracked production types
        run: >-
          git ls-files -z -- ':(glob)src/**/*.py' |
          xargs -0 uv run pyright --warnings

      - name: Check tracked test types
        run: >-
          git ls-files -z -- ':(glob)tests/**/*.py' |
          xargs -0 uv run pyright --warnings

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run invariant tests
        run: uv run pytest tests/test_invariant_*.py -v

      - name: Run unit tests with coverage
        env:
          COVERAGE_CORE: sysmon
        run: uv run pytest -W error -m "not integration and not slow" -n 4 --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=77

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: python-strategy/coverage.xml
          retention-days: 30

      - name: Generate coverage badge JSON
        if: always()
        working-directory: ./python-strategy
        run: |
          # Extract coverage percentage from the XML report
          if [ -f coverage.xml ]; then
            COV_PCT=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate']) * 100
          print(f'{rate:.1f}')
          ")
            echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV_PCT}%\",\"color\":\"brightgreen\"}" > coverage-badge.json
            echo "Coverage: ${COV_PCT}%"
          else
            echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"unknown\",\"color\":\"red\"}" > coverage-badge.json
          fi

      - name: Upload coverage badge data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: python-strategy/coverage-badge.json
          retention-days: 30
        # To display a dynamic coverage badge in README, you can:
        # 1. Publish coverage-badge.json to GitHub Pages or a gist
        # 2. Use shields.io endpoint badge: ![Coverage](https://img.shields.io/endpoint?url=<URL_TO_JSON>)
        # Or integrate with Codecov/Coveralls for automatic badge generation.


  # The largest fast-lane call took 77.48s locally; ubuntu-latest is 1.5-2.5x slower, so allow 300s per fast test and 1800s per slow test.
  python-slow:
    name: Python Slow Tests
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ./python-strategy
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (for fluxtrade_core.so)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-data-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-data-service/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Select PyO3 interpreter
        run: echo "PYO3_PYTHON=$(uv run --no-sync python -c 'import os,sys; print(os.path.abspath(sys.executable))')" >> "$GITHUB_ENV"

      - name: Build and install fluxtrade_core.so
        working-directory: ./rust-data-service
        run: |
          test -x "$PYO3_PYTHON"
          cargo build --lib --release
          cp target/release/libfluxtrade_core.so ../python-strategy/src/fluxtrade_core.so

      - name: Verify native module ABI
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -c 'import sys, fluxtrade_core; print(sys.version); print(fluxtrade_core.__file__)'

      - name: Run slow tests
        run: uv run pytest -W error -m "slow and not integration" -n 4 --timeout=1800 --durations=50

  integration-check:
    name: Integration Tests (Rust + Python)
    runs-on: ubuntu-latest
    needs: [rust-check, python-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluxtrade
          POSTGRES_PASSWORD: fluxtrade
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxtrade -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        working-directory: ./python-strategy
        run: uv python install

      - name: Select PyO3 interpreter
        working-directory: ./python-strategy
        run: echo "PYO3_PYTHON=$(uv run --no-sync python -c 'import os,sys; print(os.path.abspath(sys.executable))')" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-data-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-data-service/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust library
        working-directory: ./rust-data-service
        run: RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup" cargo build --lib --release
        if: runner.os == 'macOS'

      - name: Build Rust library (Linux)
        working-directory: ./rust-data-service
        run: test -x "$PYO3_PYTHON" && cargo build --lib --release
        if: runner.os == 'Linux'

      - name: Copy .so to Python
        run: |
          if [ -f rust-data-service/target/release/libfluxtrade_core.dylib ]; then
            cp rust-data-service/target/release/libfluxtrade_core.dylib python-strategy/src/fluxtrade_core.so
          elif [ -f rust-data-service/target/release/libfluxtrade_core.so ]; then
            cp rust-data-service/target/release/libfluxtrade_core.so python-strategy/src/fluxtrade_core.so
          else
            echo "::error::Rust library not found, cannot run integration tests"
            exit 1
          fi

      - name: Verify native module ABI
        working-directory: ./python-strategy
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -c 'import sys, fluxtrade_core; print(sys.version); print(fluxtrade_core.__file__)'

      - name: Set up Node for real Control Plane browser integration
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify integration browser Node and npm versions
        working-directory: ./frontend
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"

      - name: Install integration browser dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install integration Chromium
        working-directory: ./frontend
        run: npm exec playwright install --with-deps chromium

      - name: Build real Control Plane browser assets
        working-directory: ./frontend
        run: npm run build

      - name: Run integration tests
        working-directory: ./python-strategy
        env:
          FLUXTRADE_RUN_POSTGRES_MIGRATION_TESTS: "1"
        run: uv run pytest -W error -m "integration or rust" -v

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node version
        run: test "$(node --version)" = "v22.23.2"

      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.8"

      - name: Install dependencies
        run: npm ci

      - name: Install bundled Chromium
        run: npm exec playwright install --with-deps chromium

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check production types
        run: npm run lint

      - name: Check Playwright types
        run: npm exec tsc -- --noEmit -p tsconfig.playwright.json

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run browser contract
        run: npm run test:browser

  refactor-gate:
    name: Refactor Gate
    if: always()
    needs: [frontend-check, integration-check, python-check, python-slow, rust-check, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test frontend workflow validator
        run: ruby .github/scripts/validate-frontend-job.rb --self-test

      - name: Validate frontend workflow contract
        run: ruby .github/scripts/validate-frontend-job.rb

      - name: Validate workflow and required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          ruby <<'RUBY'
          require "digest"
          require "json"
          require "yaml"

          workflow_path = ".github/workflows/ci.yml"
          manifest_path = ".github/refactor-required-jobs.json"

          fail_closed = lambda do |code, detail, next_action|
            warn "component=refactor-gate task=validate operation=aggregate stage=failed canonical_error=#{code} detail=#{detail} disposition=FAIL_CLOSED next_action=#{next_action}"
            exit 1
          end

          begin
            manifest = JSON.parse(File.read(manifest_path))
            workflow_bytes = File.binread(workflow_path)
            workflow = YAML.safe_load(workflow_bytes, aliases: false)
          rescue JSON::ParserError, Psych::Exception, Errno::ENOENT => error
            fail_closed.call("MALFORMED_CONFIGURATION", error.class.name, "repair_workflow_or_manifest")
          end

          expected_keys = %w[aggregate_job_id excluded_job_ids job_graph_digest required_job_ids schema workflow_path workflow_sha256]
          unless manifest.is_a?(Hash) && manifest.keys.sort == expected_keys &&
                 manifest["schema"] == "fluxtrade_refactor_expected_jobs_v1" &&
                 manifest["workflow_path"] == workflow_path &&
                 manifest["aggregate_job_id"] == "refactor-gate"
            fail_closed.call("MANIFEST_SCHEMA_MISMATCH", "manifest_contract", "repair_manifest")
          end

          workflow_sha = Digest::SHA256.hexdigest(workflow_bytes)
          unless workflow_sha == manifest["workflow_sha256"]
            fail_closed.call("WORKFLOW_DIGEST_MISMATCH", "workflow_sha256=#{workflow_sha}", "update_workflow_and_manifest_atomically")
          end

          jobs = workflow.is_a?(Hash) ? workflow["jobs"] : nil
          unless jobs.is_a?(Hash) && jobs.keys.all? { |id| id.is_a?(String) }
            fail_closed.call("JOB_GRAPH_MISMATCH", "invalid_jobs", "reconcile_manifest_and_workflow")
          end

          graph = jobs.keys.sort.to_h do |id|
            job = jobs[id]
            unless job.is_a?(Hash)
              fail_closed.call("JOB_GRAPH_MISMATCH", "invalid_job=#{id}", "reconcile_manifest_and_workflow")
            end
            raw_needs = job.fetch("needs", [])
            needs = raw_needs.is_a?(String) ? [raw_needs] : raw_needs
            unless needs.is_a?(Array) && needs.all? { |need| need.is_a?(String) } && needs.uniq.length == needs.length
              fail_closed.call("JOB_GRAPH_MISMATCH", "invalid_needs=#{id}", "reconcile_manifest_and_workflow")
            end
            [id, needs.sort]
          end
          graph_sha = Digest::SHA256.hexdigest(JSON.generate(graph))
          unless graph_sha == manifest["job_graph_digest"]
            fail_closed.call("JOB_GRAPH_MISMATCH", "job_graph_digest=#{graph_sha}", "reconcile_manifest_and_workflow")
          end

          aggregate = manifest["aggregate_job_id"]
          required = manifest["required_job_ids"]
          non_aggregate = jobs.keys.reject { |id| id == aggregate }.sort
          excluded = manifest["excluded_job_ids"]
          unless excluded.is_a?(Array) && excluded == excluded.sort && excluded.uniq == excluded &&
                 excluded.all? { |id| non_aggregate.include?(id) } &&
                 required.is_a?(Array) && required == required.sort && required.uniq == required &&
                 (required & excluded).empty? && (required + excluded).sort == non_aggregate
            fail_closed.call("JOB_GRAPH_MISMATCH", "required_job_ids_or_exclusions", "reconcile_manifest_and_workflow")
          end
          unless graph[aggregate] == required
            fail_closed.call("JOB_GRAPH_MISMATCH", "aggregate_needs", "reconcile_manifest_and_workflow")
          end

          begin
            runtime_needs = JSON.parse(ENV.fetch("NEEDS_JSON"))
          rescue KeyError, JSON::ParserError => error
            fail_closed.call("MALFORMED_RUNTIME_NEEDS", error.class.name, "rerun_required_jobs")
          end
          unless runtime_needs.is_a?(Hash) && runtime_needs.keys.sort == required
            fail_closed.call("REQUIRED_JOB_MISSING", "runtime_job_set", "rerun_required_jobs")
          end
          slow_result_accepted = lambda do |event_name, ref, result|
            scheduled = (event_name == "push" && %w[refs/heads/main refs/heads/develop].include?(ref)) || %w[schedule workflow_dispatch].include?(event_name)
            scheduled ? result == "success" : result == "skipped"
          end
          unless slow_result_accepted.call("schedule", "refs/heads/main", "success") &&
                 !slow_result_accepted.call("schedule", "refs/heads/main", "failure") &&
                 !slow_result_accepted.call("schedule", "refs/heads/main", "cancelled") &&
                 slow_result_accepted.call("pull_request", "refs/pull/7/merge", "skipped") &&
                 !slow_result_accepted.call("pull_request", "refs/pull/7/merge", "success")
            fail_closed.call("SLOW_JOB_POLICY_SELF_TEST_FAILED", "event_result_matrix", "repair_slow_job_policy")
          end
          required.each do |id|
            entry = runtime_needs[id]
            unless entry.is_a?(Hash) && entry["result"].is_a?(String)
              fail_closed.call("MALFORMED_RUNTIME_NEEDS", "job_id=#{id}", "rerun_required_jobs")
            end
            accepted = id == "python-slow" ? slow_result_accepted.call(ENV.fetch("GITHUB_EVENT_NAME"), ENV.fetch("GITHUB_REF"), entry["result"]) : entry["result"] == "success"
            unless accepted
              fail_closed.call("REQUIRED_JOB_NOT_SUCCESS", "job_id=#{id} result=#{entry["result"]}", "inspect_named_job")
            end
          end

          puts "component=refactor-gate task=validate operation=aggregate stage=complete disposition=PASS workflow_sha256=#{workflow_sha} job_graph_digest=#{graph_sha}"
          RUBY
